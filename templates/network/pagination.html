{% if items.paginator.num_pages > 1 %}<div class="pagination">{% if items.has_previous %}<a href="?{{ query_string }}&page={{ items.previous_page_number }}">← Anterior</a>{% endif %}<span>Página {{ items.number }} de {{ items.paginator.num_pages }}</span>{% if items.has_next %}<a href="?{{ query_string }}&page={{ items.next_page_number }}">Próxima →</a>{% endif %}</div>{% endif %}
