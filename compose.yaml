services:
  web:
    build: .
    init: true
    env_file: .env
    environment:
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:${ERP_PORT:-8000}:8000"
    volumes:
      - erp_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  erp_data:
